<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Navy background -->
  <rect width="512" height="512" rx="102" fill="#1E3A8A"/>

  <!-- Open book (white) -->
  <!-- Left page -->
  <path d="M100 320 Q100 180 256 160 L256 380 Q180 365 100 380 Z" fill="white" opacity="0.95"/>
  <!-- Right page -->
  <path d="M412 320 Q412 180 256 160 L256 380 Q332 365 412 380 Z" fill="white" opacity="0.85"/>
  <!-- Spine -->
  <rect x="248" y="160" width="16" height="220" rx="8" fill="#1E3A8A"/>
  <!-- Book bottom bar -->
  <rect x="95" y="375" width="322" height="22" rx="11" fill="white" opacity="0.9"/>

  <!-- Sparkle / star (amber #F59E0B) top-right -->
  <g transform="translate(360,120)">
    <!-- 4-point star -->
    <path d="M0-42 L10-10 L42 0 L10 10 L0 42 L-10 10 L-42 0 L-10-10 Z"
          fill="#F59E0B"/>
    <!-- small dots -->
    <circle cx="58" cy="-20" r="8" fill="#FCD34D"/>
    <circle cx="30" cy="-58" r="6" fill="#FCD34D"/>
    <circle cx="62" cy="12" r="5" fill="#F59E0B"/>
  </g>
</svg>
